name: khmer_pdf_shaper
description: A pure Dart package for rendering correctly shaped, searchable Khmer Unicode text in PDF documents with bundled Battambang font and cluster-safe wrapping.
version: 1.0.0
homepage: https://github.com/hengmengsroin/khmer_pdf_shaper
repository: https://github.com/hengmengsroin/khmer_pdf_shaper
issue_tracker: https://github.com/hengmengsroin/khmer_pdf_shaper/issues
topics:
  - khmer
  - pdf
  - font
  - typography
  - shaping

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Standard pdf package for PDF document generation
  pdf: ^3.11.3
  # SHA-256 font binary integrity verification
  crypto: ^3.0.3
  # Annotations such as @internal
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffi: ^2.1.3

flutter:
  assets:
    - assets/fonts/Battambang-Regular.ttf